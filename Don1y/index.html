<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W-Anime</title>
    <style>
        /* Обновленная цветовая палитра: Темно-зеленый и Золотой */
        :root { --primary: #D4AF37; --dark: #0B2B1A; --text-light: #fff; --text-dark: #222; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; transition: 0.3s; line-height: 1.6; }
        body.light { background: #f4f6f4; color: var(--text-dark); }
        body.dark { background: #111412; color: var(--text-light); }

        /* Пространство по бокам (ограничитель ширины) */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        header {
            background: linear-gradient(90deg, var(--dark), #144d2e);
            color: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--primary);
        }
        
        .header-inner {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; flex-wrap: wrap; gap: 15px;
        }

        .nav a { margin: 0 10px; text-decoration: none; color: white; font-weight: bold; cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .nav a:hover { opacity: 1; color: var(--primary); }

        .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .search, .genre-filter { 
            padding: 8px 12px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.4); 
            outline: none; background: rgba(255,255,255,0.1); color: white; 
        }
        .genre-filter option { background: var(--dark); color: white; }
        .theme-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: white; }
        
        /* Кнопки переделаны под золотой акцент */
        .auth-btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; background: var(--primary); color: var(--dark); font-weight: bold; transition: 0.2s; }
        .auth-btn:hover { background: #ebd07a; transform: translateY(-1px); }
        
        #user-block { display: none; align-items: center; gap: 10px; }
        #header-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); cursor: pointer; }

        main { padding: 30px 0; min-height: 80vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }

        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: 0.3s; display: flex; flex-direction: column; height: 100%; border: 1px solid transparent; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        body.dark .card { background: #1a1e1a; border: 1px solid #2a332a; }
        body.dark .card:hover { border-color: var(--primary); }
        .card img { width: 100%; height: 320px; object-fit: cover; }

        .progress-container { height: 6px; background: #eee; margin: 10px 10px 0; border-radius: 3px; overflow: hidden; }
        body.dark .progress-container { background: #333; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }
        .progress-text { font-size: 11px; margin: 4px 10px 10px; opacity: 0.7; }

        .card h3 { margin: 0 10px 10px; font-size: 16px; flex-grow: 1; }
        .card-buttons { display: flex; gap: 8px; padding: 0 10px 10px; }
        .card button { flex: 1; background: var(--dark); color: var(--primary); padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .card button:hover { opacity: 0.9; }
        .fav-btn { width: 45px; flex: none !important; background: rgba(0,0,0,0.05) !important; color: inherit !important; border: 1px solid #ccc !important; }
        body.dark .fav-btn { background: #222 !important; border-color: #444 !important; }

        #player-section, #cabinet-section { display: none; }
        
        .player-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .rating-area { display: flex; flex-direction: row-reverse; }
        .rating-area input { display: none; }
        .rating-area label { font-size: 35px; color: #ccc; cursor: pointer; transition: 0.2s; line-height: 1; }
        .rating-area input:checked ~ label, .rating-area label:hover, .rating-area label:hover ~ label { color: var(--primary); }

        .anime-info-box { background: rgba(11, 43, 26, 0.05); padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 4px solid var(--primary); }
        body.dark .anime-info-box { background: rgba(255,255,255,0.03); }
        
        .characters-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .characters-scroll::-webkit-scrollbar { height: 6px; }
        .characters-scroll::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
        .char-card { text-align: center; min-width: 80px; }
        .char-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .char-card p { font-size: 13px; margin: 8px 0 0; font-weight: bold; }

        .iframe-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #video-iframe { width: 100%; height: 100%; border: none; }
        .episode-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .ep-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--dark); background: transparent; color: inherit; cursor: pointer; transition: 0.2s; font-weight: bold; }
        body.dark .ep-btn { border-color: #444; }
        .ep-btn.active { background: var(--dark); color: var(--primary); border-color: var(--dark); }

        .avatar-box { margin-bottom: 20px; display: flex; align-items: center; gap: 20px; }
        #user-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal { background: white; padding: 30px; border-radius: 20px; width: 320px; text-align: center; border: 1px solid var(--primary); }
        body.dark .modal { background: #1a1e1a; }
        .modal input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; background: #f9f9f9; }
        body.dark .modal input { background: #111; border-color: #333; color: white; }
        
    </style>
</head>
<body class="light">

<header>
    <div class="header-inner container">
        <h1 style="margin: 0; display: flex; align-items: center; gap: 10px;">
            <span style="color: var(--primary);">🎌</span> W-Anime
        </h1>
        <nav class="nav">
            <a onclick="showCatalog()">Каталог</a>
            <a id="profile-link" onclick="showCabinet()" style="display:none;">Кабинет</a>
            <a id="admin-link" href="admin.html" style="display:none; color: var(--primary);">👑 Админ-панель</a>
        </nav>
        <div class="header-controls">
            <select id="genre-filter" class="genre-filter" onchange="filterAnime()">
                <option value="">Все жанры</option>
            </select>
            <input type="text" id="search" class="search" placeholder="Поиск..." oninput="filterAnime()">
            <button onclick="toggleTheme()" class="theme-btn" title="Сменить тему">🌓</button>
            <div id="auth-section"><button class="auth-btn" onclick="openAuthModal()">Войти</button></div>
            <div id="user-block">
                <img id="header-avatar" src="" onclick="showCabinet()">
                <button class="auth-btn" style="background: rgba(255,255,255,0.2); color: white;" onclick="logout()">Выход</button>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <div id="catalog-section">
        <h2>Каталог аниме</h2>
        <div class="grid" id="animeList"></div>
    </div>

    <div id="cabinet-section">
        <h2 id="cabinet-title">Личный кабинет</h2>
        <div class="avatar-box">
            <img id="user-avatar" src="https://via.placeholder.com/150">
            <div>
                <label style="background:var(--dark); color:var(--primary); font-weight:bold; padding:10px 20px; border-radius:8px; cursor:pointer; display:inline-block;">
                    Сменить фото
                    <input type="file" style="display:none" accept="image/*" onchange="uploadAvatar(this)">
                </label>
            </div>
        </div>
        <h3 style="text-align:left; border-bottom: 2px solid var(--primary); padding-bottom: 10px;">❤️ Избранное и прогресс</h3>
        <div class="grid" id="favoriteList"></div>
    </div>

    <div id="player-section">
        <div class="player-header">
            <div>
                <button class="auth-btn" style="margin-bottom:10px; background:transparent; border:1px solid var(--primary); color:inherit;" onclick="showCatalog()">← Назад в каталог</button>
                <h2 id="player-title" style="margin: 5px 0 0; color: var(--primary); font-size: 28px;">Название</h2>
            </div>
            <div class="rating-area">
                <input type="radio" id="star-5" name="rating" value="5" onclick="setRating(5)"><label for="star-5">★</label>
                <input type="radio" id="star-4" name="rating" value="4" onclick="setRating(4)"><label for="star-4">★</label>
                <input type="radio" id="star-3" name="rating" value="3" onclick="setRating(3)"><label for="star-3">★</label>
                <input type="radio" id="star-2" name="rating" value="2" onclick="setRating(2)"><label for="star-2">★</label>
                <input type="radio" id="star-1" name="rating" value="1" onclick="setRating(1)"><label for="star-1">★</label>
            </div>
        </div>

        <div class="anime-info-box">
            <p id="player-desc" style="margin-top: 0;"></p>
            <div id="chars-container" style="display: none;">
                <h4 style="margin-bottom: 10px;">Персонажи:</h4>
                <div class="characters-scroll" id="anime-characters"></div>
            </div>
        </div>

        <div class="iframe-container"><iframe id="video-iframe" src="" allowfullscreen></iframe></div>
        <div class="episode-buttons" id="episode-buttons"></div>
    </div>
</main>

<div class="modal-overlay" id="auth-modal">
    <div class="modal">
        <h2 style="margin-top:0; color: var(--primary);" id="auth-title">Вход</h2>
        
        <div style="display:flex; gap:10px; margin-bottom:15px; justify-content:center;">
            <button class="ep-btn active" id="tab-login" onclick="switchAuthTab('login')">Вход</button>
            <button class="ep-btn" id="tab-reg" onclick="switchAuthTab('reg')">Регистрация</button>
        </div>

        <input type="text" id="username-input" placeholder="Логин">
        <input type="password" id="password-input" placeholder="Пароль">
        <input type="password" id="password-confirm" placeholder="Повторите пароль" style="display:none;">
        
        <button class="auth-btn" style="width:100%; margin-top:10px; padding: 12px;" onclick="handleAuth()">Подтвердить</button>
        <button style="background:none; border:none; margin-top:15px; cursor:pointer; color:gray" onclick="closeAuthModal()">Закрыть</button>
    </div>
</div>

<script>
let animeData = JSON.parse(localStorage.getItem('animeData')) || [];
let currentId = null;
let authMode = 'login'; 

function initGenres() {
    let genres = new Set();
    animeData.forEach(a => { if(a.genres) a.genres.forEach(g => genres.add(g)); });
    const select = document.getElementById('genre-filter');
    select.innerHTML = '<option value="">Все жанры</option>' + 
        Array.from(genres).sort().map(g => `<option value="${g}">${g}</option>`).join('');
}

function filterAnime() {
    const textVal = document.getElementById('search').value.toLowerCase();
    const genreVal = document.getElementById('genre-filter').value;
    
    const filtered = animeData.filter(a => {
        const matchText = a.title.toLowerCase().includes(textVal);
        const matchGenre = genreVal === "" || (a.genres && a.genres.includes(genreVal));
        return matchText && matchGenre;
    });
    render(filtered);
}

function checkAuth() {
    const user = localStorage.getItem('currentUser');
    
    if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('user-block').style.display = 'flex';
        document.getElementById('profile-link').style.display = 'inline';
        
        const roles = JSON.parse(localStorage.getItem('usersRoles')) || {};
        const myRole = roles[user] || 'user';
        
        if (myRole === 'admin' || myRole === 'moderator') {
            document.getElementById('admin-link').style.display = 'inline';
        } else {
            document.getElementById('admin-link').style.display = 'none';
        }

        const avatar = localStorage.getItem(`avatar_${user}`) || "https://via.placeholder.com/150";
        document.getElementById('header-avatar').src = avatar;
        document.getElementById('user-avatar').src = avatar;
        document.getElementById('cabinet-title').innerText = "Кабинет: " + user;
    } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('user-block').style.display = 'none';
        document.getElementById('profile-link').style.display = 'none';
        document.getElementById('admin-link').style.display = 'none';
    }
}

function switchAuthTab(mode) {
    authMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabReg = document.getElementById('tab-reg');
    
    document.getElementById('username-input').value = '';
    document.getElementById('password-input').value = '';
    document.getElementById('password-confirm').value = '';

    if (mode === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        document.getElementById('auth-title').innerText = 'Вход';
        document.getElementById('password-confirm').style.display = 'none';
    } else {
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
        document.getElementById('auth-title').innerText = 'Регистрация';
        document.getElementById('password-confirm').style.display = 'block';
    }
}

function handleAuth() {
    const login = document.getElementById('username-input').value.trim();
    const pass = document.getElementById('password-input').value.trim();
    const confirmPass = document.getElementById('password-confirm').value.trim();
    
    if (login.length < 2 || pass.length < 3) return alert("Логин от 2 символов, пароль от 3!");

    let users = JSON.parse(localStorage.getItem('usersBase')) || {};
    let roles = JSON.parse(localStorage.getItem('usersRoles')) || {};

    if (authMode === 'login') {
        if (!users[login]) return alert("Пользователь не найден! Зарегистрируйтесь.");
        if (users[login] !== pass) return alert("Неверный пароль!");
    } else {
        if (users[login]) return alert("Пользователь уже существует!");
        if (pass !== confirmPass) return alert("Пароли не совпадают!");
        
        users[login] = pass;
        if (Object.keys(users).length === 1) roles[login] = 'admin';
        else roles[login] = 'user';
        
        localStorage.setItem('usersBase', JSON.stringify(users));
        localStorage.setItem('usersRoles', JSON.stringify(roles));
        alert("Аккаунт создан!");
    }

    localStorage.setItem('currentUser', login);
    closeAuthModal();
    checkAuth();
    render(animeData);
}

function logout() { localStorage.removeItem('currentUser'); location.reload(); }

function openAuthModal() { 
    switchAuthTab('login'); 
    document.getElementById('auth-modal').style.display = 'flex'; 
}

function closeAuthModal() { 
    document.getElementById('auth-modal').style.display = 'none'; 
}

function createCard(item, isFav) {
    const user = localStorage.getItem('currentUser');
    const watched = JSON.parse(localStorage.getItem(`watched_${user}_${item.id}`)) || [];
    const total = item.episodes && item.episodes.length > 0 ? item.episodes.length : 1;
    const progress = (watched.length / total) * 100;

    return `
        <div class="card">
            <img src="${item.img}">
            <div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="progress-text">Серии: ${watched.length} / ${total}</div>
            <h3>${item.title}</h3>
            <div class="card-buttons">
                <button onclick="openPlayer(${item.id})">Смотреть</button>
                <button class="fav-btn" title="В избранное" onclick="toggleFav(${item.id})">${isFav?'❤️':'🤍'}</button>
            </div>
        </div>
    `;
}

function render(data) {
    const user = localStorage.getItem('currentUser');
    const favs = JSON.parse(localStorage.getItem(`fav_${user}`)) || [];
    document.getElementById('animeList').innerHTML = data.map(a => createCard(a, favs.includes(a.id))).join('');
}

function openPlayer(id) {
    currentId = id;
    const item = animeData.find(a => a.id === id);
    const user = localStorage.getItem('currentUser');
    
    document.getElementById('catalog-section').style.display = 'none';
    document.getElementById('cabinet-section').style.display = 'none';
    document.getElementById('player-section').style.display = 'block';
    
    document.getElementById('player-title').innerText = item.title;
    
    document.getElementById('player-desc').innerText = item.desc || "Описание отсутствует.";
    const charContainer = document.getElementById('anime-characters');
    const charWrapper = document.getElementById('chars-container');
    
    if (item.characters && item.characters.length > 0) {
        charContainer.innerHTML = item.characters.map(c => `
            <div class="char-card">
                <img src="${c.img}" alt="${c.name}">
                <p>${c.name}</p>
            </div>
        `).join('');
        charWrapper.style.display = 'block';
    } else {
        charWrapper.style.display = 'none';
    }

    const rating = localStorage.getItem(`rating_${user}_${id}`);
    document.querySelectorAll('.rating-area input').forEach(inp => inp.checked = (inp.value == rating));

    const epContainer = document.getElementById('episode-buttons');
    if (item.episodes && item.episodes.length > 0) {
        epContainer.innerHTML = item.episodes.map((ep, i) => `
            <button class="ep-btn" onclick="changeEp('${ep.src}', this, ${i})">${ep.title}</button>
        `).join('');
        
        // Вот здесь firstChild заменен на firstElementChild
        changeEp(item.episodes[0].src, epContainer.firstElementChild, 0);
    } else {
        epContainer.innerHTML = "<p style='color: gray'>Серии еще не добавлены</p>";
        document.getElementById('video-iframe').src = "";
    }
    
    window.scrollTo(0,0);
}

function changeEp(src, btn, idx) {
    document.getElementById('video-iframe').src = src;
    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const user = localStorage.getItem('currentUser');
    if(user) {
        let watched = JSON.parse(localStorage.getItem(`watched_${user}_${currentId}`)) || [];
        if(!watched.includes(idx)) { 
            watched.push(idx); 
            localStorage.setItem(`watched_${user}_${currentId}`, JSON.stringify(watched)); 
        }
    }
}

function setRating(val) {
    const user = localStorage.getItem('currentUser');
    if(!user) return alert("Для оценки нужен вход!");
    localStorage.setItem(`rating_${user}_${currentId}`, val);
}

function toggleFav(id) {
    const user = localStorage.getItem('currentUser');
    if(!user) return openAuthModal();
    let favs = JSON.parse(localStorage.getItem(`fav_${user}`)) || [];
    if(favs.includes(id)) favs = favs.filter(i => i !== id);
    else favs.push(id);
    localStorage.setItem(`fav_${user}`, JSON.stringify(favs));
    
    filterAnime(); 
    if(document.getElementById('cabinet-section').style.display === 'block') showCabinet();
}

function uploadAvatar(input) {
    const reader = new FileReader();
    reader.onload = e => {
        localStorage.setItem(`avatar_${localStorage.getItem('currentUser')}`, e.target.result);
        checkAuth();
    };
    reader.readAsDataURL(input.files[0]);
}

function showCabinet() {
    const user = localStorage.getItem('currentUser');
    if(!user) return openAuthModal();
    document.getElementById('catalog-section').style.display = 'none';
    document.getElementById('player-section').style.display = 'none';
    document.getElementById('cabinet-section').style.display = 'block';
    
    const favs = JSON.parse(localStorage.getItem(`fav_${user}`)) || [];
    const filtered = animeData.filter(a => favs.includes(a.id));
    document.getElementById('favoriteList').innerHTML = filtered.map(a => createCard(a, true)).join('');
}

function showCatalog() {
    document.getElementById('catalog-section').style.display = 'block';
    document.getElementById('player-section').style.display = 'none';
    document.getElementById('cabinet-section').style.display = 'none';
    filterAnime();
}

function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');
    document.body.classList.toggle('light');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

if(localStorage.getItem('theme') === 'dark') { 
    document.body.className = 'dark'; 
} else {
    document.body.className = 'light';
}

checkAuth();
initGenres();
showCatalog();
</script>
</body>
</html>
